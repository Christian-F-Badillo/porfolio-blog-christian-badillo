# CI for S3 update
name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      step:
        description: 'Step to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - render
          - sync
          #- invalidate

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Setup Quarto
        if: inputs.step == 'all' || inputs.step == 'render' || inputs.step == ''
        uses: quarto-dev/quarto-actions/setup@v2
    
      - name: Render site
        if: inputs.step == 'all' || inputs.step == 'render' || inputs.step == ''
        run: quarto render
    
      - name: Save _site artifact
        if: inputs.step == 'all' || inputs.step == 'render' || inputs.step == ''
        uses: actions/upload-artifact@v4
        with:
          name: quarto-site
          path: _site/
          retention-days: 1
    
      - name: Restore _site artifact
        if: inputs.step == 'sync'
        uses: actions/download-artifact@v4
        with:
          name: quarto-site
          path: _site/
    
      - name: Configure AWS credentials
        if: inputs.step == 'all' || inputs.step == 'sync' || inputs.step == ''
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
    
      - name: Sync to S3
        if: inputs.step == 'all' || inputs.step == 'sync' || inputs.step == ''
        run: |
          aws s3 sync _site/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "max-age=86400"

      # - name: Invalidate CloudFront
      #   if: inputs.step == 'all' || inputs.step == 'invalidate' || inputs.step == ''
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
      #       --paths "/*"

          
